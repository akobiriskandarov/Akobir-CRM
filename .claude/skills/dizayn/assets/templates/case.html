<!-- Keys/natija posti: katta raqam + kontekst + muddat (ishonch va lead uchun) -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="{{ASSETS}}/base.css">
<style>
body{background:{{bg|#F4F1EA}};color:var(--ink)}
.canvas{display:flex;flex-direction:column;justify-content:space-between}
.tag{display:inline-block;align-self:flex-start;border:2px solid var(--ink);border-radius:999px;padding:1vh 2.6vw;font-weight:700;font-size:2.4vw;letter-spacing:.12em;text-transform:uppercase}
.num{font-family:var(--display);font-weight:900;font-size:{{num_size|20vw}};line-height:.9;letter-spacing:-.04em;color:var(--accent-2)}
.label{font-family:var(--display);font-weight:700;font-size:5.4vw;line-height:1.1;margin-top:2vh}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:2vw;border-top:2px solid var(--ink);padding-top:3vh}
.rows div{font-size:2.6vw;line-height:1.35}.rows b{display:block;font-family:var(--display);font-size:4.4vw}
.foot{display:flex;justify-content:space-between;font-size:2.3vw;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
</style></head><body><div class="canvas">
<span class="tag">{{tag|Keys · Bovari}}</span>
<div><div class="num">{{num|+212%}}</div><div class="label">{{label|lead oqimi 60 kunda}}</div></div>
<div class="rows"><div><b>{{a_val|3 → 41}}</b>{{a_lbl|kunlik murojaat}}</div><div><b>{{b_val|−38%}}</b>{{b_lbl|lead narxi}}</div></div>
<div class="foot"><span>{{client|Mijoz: to'yxona}}</span><span>{{cta|Batafsil — izohda}}</span></div>
</div></body></html>
